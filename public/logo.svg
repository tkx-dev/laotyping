<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#141211" />
    </linearGradient>

    <!-- Keycap Bevel Gradient -->
    <linearGradient id="keycapDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b3531" />
      <stop offset="100%" stop-color="#221e1c" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Keycap Base with Shadow -->
  <rect
    x="12"
    y="12"
    width="96"
    height="96"
    rx="24"
    fill="url(#bgGrad)"
    stroke="url(#accentGrad)"
    stroke-width="2.5"
    filter="url(#dropShadow)"
  />

  <!-- Inner Keycap Dish (Tactile Recessed Surface) -->
  <rect
    x="22"
    y="20"
    width="76"
    height="76"
    rx="18"
    fill="url(#keycapDish)"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="1.5"
  />

  <!-- Subtle Top Highlight Rim -->
  <path
    d="M 36 22 L 84 22"
    stroke="#ffffff"
    stroke-opacity="0.25"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Modern Lao 'ລ' Glyphic Mark with Glowing Gold Finish -->
  <g filter="url(#glow)">
    <!-- Stylized, balanced vector Lao 'ລ' -->
    <path
      d="M 44 68 
         C 44 73 47.5 76 53 76 
         C 58.5 76 62 72 62 66 
         C 62 55 50 56 50 47 
         C 50 41.5 54 38 60 38 
         C 66 38 70 41.5 70 47
         L 70 49
         M 70 44
         C 70 44 74 38 80 43
         C 84 46.5 83 52 83 75"
      fill="none"
      stroke="url(#accentGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Dot / Loop Detail -->
    <circle cx="44" cy="67" r="2.5" fill="#fef08a" />
  </g>

  <!-- Speed Dash / Keystroke Ripple Accent (bottom right) -->
  <circle cx="86" cy="84" r="3" fill="#eab308" opacity="0.8" />
  <circle cx="94" cy="84" r="1.5" fill="#facc15" opacity="0.6" />
</svg>
